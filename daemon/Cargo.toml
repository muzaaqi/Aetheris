[package]
name = "aetheris-daemon"
version = "0.1.0"
edition = "2024"
authors = ["Muzaaqi <muzaaqi@muzone.my.id>"]
description = "Lightweight OS-level AI Agent HUD daemon for Hyprland and Caelestia Shell"
license = "MIT"

[dependencies]
# Async runtime & networking
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization & JSON-RPC
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hyprland IPC socket integration
hyprland = "0.4.0-beta.3"

# In-kernel filesystem monitoring (Antigravity transcripts)
notify = "7.0"

# Fast git-aware file discovery for @file mentions
ignore = "0.4"
walkdir = "2.5"

# Error handling
thiserror = "2.0"

# Graceful shutdown
tokio-util = { version = "0.7", features = ["rt"] }

# Logging & Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# WebSocket client for integration tests
tokio-tungstenite = "0.26"
